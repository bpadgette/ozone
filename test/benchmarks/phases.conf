# One oha run per line: name connections rate [extra oha args...]
# rate is requests/second; 0 means as fast as the server answers.
# A rated phase gets --latency-correction so tail latency is not hidden
# by coordinated omission.
single-user    1    0
30-users       30   0
100-users      100  0
100-users-no-keepalive  100  0  --disable-keepalive
100-users-at-50k-rps    100  50000
